services:
  - type: web
    name: keystone-fsm-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: "dev"
      - key: JWT_SECRET
        value: "S3cr3tK3yst0n3FSM_ChangeThisInProductionUseAtLeast32Chars!"
